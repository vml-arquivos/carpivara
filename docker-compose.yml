services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blbuscar}
      POSTGRES_USER: ${POSTGRES_USER:-blbuscar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blbuscar_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - blbuscar_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blbuscar} -d ${POSTGRES_DB:-blbuscar}"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  blbuscar_pgdata:
